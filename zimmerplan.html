<script>
(() => {
const P = JSON.parse(document.getElementById('p').textContent);
const q = document.getElementById('q'), a = document.getElementById('a'), m = document.getElementById('m'), f = document.getElementById('f');
q.textContent = P.q;
const norm = s => s.normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim();
const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const LS = 'karaoke-antwort';
async function unlock(answer, silent){
  m.textContent = 'Wird geöffnet…'; m.className = 'msg';
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(answer)), 'PBKDF2', false, ['deriveKey']);
    let K = null;
    for (const k of P.keys){
      const wk = await crypto.subtle.deriveKey({name:'PBKDF2', salt:un(k.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      try{ K = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:un(k.iv)}, wk, un(k.w))); break; }catch(e){}
    }
    if (!K) throw 0;
    const key = await crypto.subtle.importKey('raw', K, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:un(P.iv)}, key, un(P.data)));
    try{ localStorage.setItem(LS, answer); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    m.textContent = silent ? '' : 'Das stimmt leider nicht.'; m.className = 'msg err';
    if (!silent){ a.select(); a.focus(); }
  }
}
f.addEventListener('submit', e => { e.preventDefault(); if (a.value.trim()) unlock(a.value); });
if (!crypto.subtle) m.textContent = 'Dieser Browser kann die Seite nicht entschlüsseln (braucht https oder eine neuere Version).';
else { const saved = localStorage.getItem(LS); if (saved) unlock(saved, true); }
})();
</script>
